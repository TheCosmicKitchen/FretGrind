<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Fret Grind – sight-reading &amp; fretboard trainer</title>
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="description" content="Free guitar fretboard and music sight-reading trainer with spaced-repetition flash cards, chord and scale spelling, and ear-training games. Works offline." />
    <meta name="theme-color" content="#5b5ce2" />
    <link rel="icon" href="icons/icon.svg" type="image/svg+xml" />
    <link rel="apple-touch-icon" href="icons/apple-touch-icon.png" />
    <link rel="manifest" href="manifest.webmanifest" />
    <link rel="stylesheet" href="css/styles.css" />
  </head>
  <body>
    <main id="app"></main>
    <noscript>Fret Grind needs JavaScript enabled to run.</noscript>
    <script src="js/data.js"></script>
    <script src="js/render.js"></script>
    <script src="js/questions.js"></script>
    <script src="js/audio.js"></script>
    <script src="js/mic.js"></script>
    <script src="js/songs.js"></script>
    <script src="js/games.js"></script>
    <script src="js/chorddb.js"></script>
    <script src="js/practice.js"></script>
    <script src="js/state.js"></script>
    <script src="js/main.js"></script>
    <script>
      if ("serviceWorker" in navigator) {
        window.addEventListener("load", () => navigator.serviceWorker.register("sw.js").catch(() => {}));
      }
    </script>
  </body>
</html>
